[pmbootstrap]
aports = HOME/.local/var/pmbootstrap/cache_git/pmaports
device = infinix-x6816d
extra_packages = lm-sensors,fastfetch,mesa-utils
jobs = NPROC
systemd = yes
timezone = Europe/Moscow
ui = phosh
user = vehans
work = HOME/.local/var/pmbootstrap

[providers]
postmarketos-usb-moded-default-profile = postmarketos-usb-moded-default-profile-developer

[mirrors]
